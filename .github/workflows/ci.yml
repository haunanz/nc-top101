name: Go CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: gofmt / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请执行 gofmt -w <file>："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: 校验 README 索引与代码一致
        run: |
          go run ./tools/genindex -write
          if ! git diff --quiet README.md; then
            echo "README.md 的题目索引已过期，请在本地执行 go run ./tools/genindex -write 后提交。"
            git diff --stat README.md
            exit 1
          fi
